# Lexicon for the ISU Cabagan pack. It helps CampusAI understand how students write; it never produces answers.
#
# RULES
#  - Add a phrase only when you have seen students use it. Collect them from real questions (README 8.10).
#  - Acronyms below are listed as campus TERMS only. Do not add an expansion (an alias) until the campus confirms what
#    the acronym stands for: the README list (8.7) is a collection checklist, not verified content.
#  - There are NO starterQuestions yet. Add one only after a verified document answers it
#    (`npm run eval` checks that every starter question is answerable).

